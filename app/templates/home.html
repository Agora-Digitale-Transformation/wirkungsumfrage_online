{% extends "layout.html" %}
{% block title %}Home{% endblock %}
{% block main %}
<h1>Control Panel</h1>
<div class="bg-primary">
    <form action="{{ url_for('example') }}" method="get">
        <label for="param">Select a Parameter:</label>
        <input type="range" id="param" name="param" min="1" max="10" value="1"
               oninput="this.nextElementSibling.value = this.value">
        <output>1</output>
        <br>
        <button class="btn btn-outline-secondary" type="submit">Beispiel Plot</button>
    </form>
    
</div>
{% endblock %}
